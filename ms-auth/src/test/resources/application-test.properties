spring.application.name=ms-auth-test

# Desactivar Config Server y Eureka durante pruebas
spring.cloud.config.enabled=false
spring.config.import=optional:
eureka.client.enabled=false
eureka.client.register-with-eureka=false
eureka.client.fetch-registry=false

# Base de datos H2 en memoria para pruebas
spring.datasource.url=jdbc:h2:mem:ms_auth_test;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate para pruebas
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# JWT de prueba
jwt.secret=test-secret-key-for-testing-purposes-only-123456789
jwt.expiration=3600000

# Evitar conflictos de beans durante pruebas
spring.main.allow-bean-definition-overriding=true