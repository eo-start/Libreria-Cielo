<div class="p-6">
  <div class="flex items-center justify-between mb-6">
    <div>
      <h1 class="text-2xl font-bold text-gray-800">Usuarios y Roles</h1>
      <p class="text-gray-500 text-sm mt-1">Gestión de accesos al sistema</p>
    </div>
    <button (click)="abrirModal()" class="btn-primary">
      <i class="fas fa-user-plus"></i> Nuevo usuario
    </button>
  </div>

  <!-- Cards de roles -->
  <div class="grid grid-cols-1 sm:grid-cols-3 gap-4 mb-6">
    <div *ngFor="let r of roles" class="card border-l-4"
         [class]="r.valor === 'ROLE_ADMIN' ? 'border-yellow-400' : r.valor === 'ROLE_CAJERO' ? 'border-green-400' : 'border-orange-400'">
      <div class="flex items-start gap-3">
        <i [class]="r.valor === 'ROLE_ADMIN' ? 'fas fa-user-shield text-yellow-500 text-2xl' :
                    r.valor === 'ROLE_CAJERO'  ? 'fas fa-cash-register text-green-500 text-2xl' :
                                                 'fas fa-warehouse text-orange-500 text-2xl'"></i>
        <div>
          <p class="font-semibold text-gray-800">{{ r.etiqueta }}</p>
          <p class="text-sm text-gray-500 mt-0.5">{{ r.desc }}</p>
        </div>
      </div>
    </div>
  </div>

  <!-- Tabla -->
  <div class="card">
    <div *ngIf="loading" class="flex justify-center py-12"><div class="spinner"></div></div>
    <div *ngIf="!loading" class="overflow-x-auto">
      <table class="tabla">
        <thead><tr>
          <th>Nombre</th><th>Usuario</th><th>Rol</th><th>Estado</th><th class="text-center">Acciones</th>
        </tr></thead>
        <tbody>
          <tr *ngFor="let u of usuarios">
            <td class="font-medium text-gray-800">{{ u.nombre }}</td>
            <td class="font-mono text-blue-600">{{ u.usuario }}</td>
            <td><span [class]="getRolBadge(u.rol)">{{ getRolLabel(u.rol) }}</span></td>
            <td><span [class]="u.estado === 'ACTIVO' ? 'badge badge-green' : 'badge badge-red'">{{ u.estado }}</span></td>
            <td class="text-center">
              <button (click)="eliminar(u)" class="p-1.5 rounded-lg text-red-600 hover:bg-red-50" title="Eliminar">
                <i class="fas fa-trash text-sm"></i>
              </button>
            </td>
          </tr>
          <tr *ngIf="usuarios.length === 0">
            <td colspan="5" class="text-center text-gray-400 py-8">
              <i class="fas fa-users text-3xl mb-2 block"></i> No hay usuarios registrados
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>

<!-- Modal -->
<div *ngIf="showModal" class="modal-overlay" (click)="cerrarModal()">
  <div class="modal-box" (click)="$event.stopPropagation()">
    <div class="flex items-center justify-between mb-4">
      <h3 class="text-lg font-semibold text-gray-800"><i class="fas fa-user-plus text-blue-500 mr-2"></i>Nuevo usuario</h3>
      <button (click)="cerrarModal()" class="text-gray-400"><i class="fas fa-times"></i></button>
    </div>
    <form [formGroup]="form" (ngSubmit)="guardar()">
      <div class="space-y-3">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Nombre completo *</label>
          <input formControlName="nombre" class="input-field" placeholder="Nombre del usuario">
          <p *ngIf="f['nombre'].invalid && f['nombre'].touched" class="error-msg">Mínimo 3 caracteres.</p>
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Usuario *</label>
          <input formControlName="userName" class="input-field" placeholder="Nombre de usuario">
          <p *ngIf="f['userName'].invalid && f['userName'].touched" class="error-msg">Mínimo 3 caracteres.</p>
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Contraseña *</label>
          <input formControlName="password" type="password" class="input-field" placeholder="Mínimo 6 caracteres">
          <p *ngIf="f['password'].invalid && f['password'].touched" class="error-msg">Mínimo 6 caracteres.</p>
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Rol *</label>
          <select formControlName="rol" class="input-field">
            <option *ngFor="let r of roles" [value]="r.valor">{{ r.etiqueta }}</option>
          </select>
        </div>
      </div>
      <div class="flex justify-end gap-2 mt-4">
        <button type="button" (click)="cerrarModal()" class="btn-secondary">Cancelar</button>
        <button type="submit" class="btn-success"><i class="fas fa-save"></i> Crear usuario</button>
      </div>
    </form>
  </div>
</div>
