<div class="min-h-screen bg-gradient-to-br from-sky-100 via-blue-50 to-indigo-100 flex items-center justify-center p-4">
  <div class="w-full max-w-md">

    <div class="text-center mb-6">
      <div class="inline-flex items-center justify-center w-16 h-16 rounded-full bg-blue-600 shadow-lg mb-3">
        <i class="fas fa-book-open text-white text-2xl"></i>
      </div>
      <h1 class="text-2xl font-bold text-gray-800">Librería Amanecer</h1>
      <p class="text-gray-500 text-sm">Crear nueva cuenta</p>
    </div>

    <div class="bg-white rounded-2xl shadow-xl p-8">
      <h2 class="text-lg font-semibold text-gray-700 mb-5 text-center">Registro de Usuario</h2>

      <form [formGroup]="form" (ngSubmit)="submit()">
        <div class="mb-3">
          <label class="block text-sm font-medium text-gray-700 mb-1">Nombre completo</label>
          <input formControlName="nombreCompleto" type="text" placeholder="Ej: Juan Pérez García" class="input-field">
          <p *ngIf="f['nombreCompleto'].invalid && f['nombreCompleto'].touched" class="error-msg">Mínimo 5 caracteres.</p>
        </div>
        <div class="mb-3">
          <label class="block text-sm font-medium text-gray-700 mb-1">Usuario</label>
          <input formControlName="userName" type="text" placeholder="Nombre de usuario" class="input-field">
          <p *ngIf="f['userName'].invalid && f['userName'].touched" class="error-msg">Mínimo 3 caracteres.</p>
        </div>
        <div class="mb-3">
          <label class="block text-sm font-medium text-gray-700 mb-1">Contraseña</label>
          <div class="relative">
            <input formControlName="password" [type]="showPass ? 'text' : 'password'" placeholder="Mínimo 6 caracteres" class="input-field pr-10">
            <button type="button" (click)="showPass = !showPass" class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-400">
              <i [class]="showPass ? 'fas fa-eye-slash' : 'fas fa-eye'"></i>
            </button>
          </div>
          <p *ngIf="f['password'].invalid && f['password'].touched" class="error-msg">Mínimo 6 caracteres.</p>
        </div>
        <div class="mb-3">
          <label class="block text-sm font-medium text-gray-700 mb-1">Confirmar contraseña</label>
          <input formControlName="confirmarPassword" type="password" placeholder="Repite la contraseña" class="input-field">
          <p *ngIf="form.errors?.['noMatch'] && f['confirmarPassword'].touched" class="error-msg">Las contraseñas no coinciden.</p>
        </div>
        <div class="mb-5">
          <label class="block text-sm font-medium text-gray-700 mb-1">Rol solicitado</label>
          <select formControlName="rol" class="input-field">
            <option value="ROLE_CAJERO">Cajero / Vendedor</option>
            <option value="ROLE_ALMACEN">Encargado de Almacén</option>
          </select>
        </div>

        <button type="submit" [disabled]="loading"
                class="w-full bg-green-600 hover:bg-green-700 disabled:opacity-60 text-white font-semibold py-3 rounded-xl transition-colors flex items-center justify-center gap-2">
          <span *ngIf="!loading"><i class="fas fa-user-plus mr-2"></i>Registrarse</span>
          <span *ngIf="loading" class="flex items-center gap-2">
            <div class="w-4 h-4 border-2 border-white border-t-transparent rounded-full animate-spin"></div>
            Registrando...
          </span>
        </button>
      </form>

      <p class="text-center text-sm text-gray-500 mt-4">
        ¿Ya tienes cuenta?
        <a routerLink="/login" class="text-blue-600 hover:underline font-medium">Inicia sesión</a>
      </p>
    </div>
  </div>
</div>
