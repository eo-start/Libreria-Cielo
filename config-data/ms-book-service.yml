server:
  port: ${SERVER_PORT:8082}
spring:
  application:
    name: ms-book-service
  cloud:
    config:
      enabled: false
  jpa:
    hibernate:
      ddl-auto: ${DDL_AUTO:update}
    open-in-view: false
    show-sql: false
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/ms_book?createDatabaseIfNotExist=true&serverTimezone=UTC}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 5
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
eureka:
  client:
    enabled: ${EUREKA_CLIENT_ENABLED:true}
    service-url:
      defaultZone: ${EUREKA_URI:http://localhost:8090/eureka/}
  instance:
    prefer-ip-address: true
    ip-address: ${SERVICE_HOST:127.0.0.1}
    instance-id: ${spring.application.name}:${SERVICE_HOST:127.0.0.1}:${server.port}
jwt:
  secret: ${JWT_SECRET}
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
springdoc:
  api-docs:
    enabled: ${API_DOCS_ENABLED:false}
  swagger-ui:
    enabled: ${API_DOCS_ENABLED:false}
app:
  seed-demo-data: ${SEED_DEMO_DATA:false}
  uploads-dir: ${UPLOADS_DIR:uploads}
